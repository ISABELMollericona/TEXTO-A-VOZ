<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Texto a Voz Masculina</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

textarea{
    width:100%;
    height:220px;
    padding:10px;
    font-size:18px;
    resize:vertical;
    box-sizing:border-box;
}

button{
    padding:12px 25px;
    font-size:18px;
    margin:10px 5px;
    cursor:pointer;
}

.control{
    margin-top:15px;
    font-size:18px;
}

input[type="range"]{
    width:300px;
}
</style>
</head>

<body>

<div class="container">

    <h2>Texto a Voz Masculina</h2>

    <textarea id="texto" placeholder="Escribe aquí el texto que deseas escuchar..."></textarea>

    <div class="control">
        <label>Velocidad: </label>
        <input type="range" id="velocidad" min="0.5" max="1.5" step="0.1" value="0.7">
        <span id="valorVelocidad">0.7</span>
    </div>

    <div>
        <button onclick="hablar()">▶ Hablar</button>
        <button onclick="pausar()">⏸ Pausar</button>
        <button onclick="reanudar()">▶ Continuar</button>
        <button onclick="detener()">⏹ Detener</button>
    </div>

</div>

<script>

let voces = [];

function cargarVoces() {
    voces = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = cargarVoces;
cargarVoces();

document.getElementById("velocidad").addEventListener("input", function () {
    document.getElementById("valorVelocidad").textContent = this.value;
});

function obtenerVozMasculina() {

    const preferencias = [
        "Microsoft Jorge",
        "Microsoft Alvaro",
        "Jorge",
        "Alvaro",
        "Mateo"
    ];

    for (let nombre of preferencias) {
        let voz = voces.find(v =>
            v.name.toLowerCase().includes(nombre.toLowerCase())
        );

        if (voz) return voz;
    }

    let vozEspanol = voces.find(v =>
        v.lang.toLowerCase().startsWith("es")
    );

    return vozEspanol || null;
}

function hablar() {

    let texto = document.getElementById("texto").value.trim();

    if (texto === "") {
        alert("Escribe un texto.");
        return;
    }

    speechSynthesis.cancel();

    let mensaje = new SpeechSynthesisUtterance(texto);

    let voz = obtenerVozMasculina();

    if (voz) {
        mensaje.voice = voz;
    }

    mensaje.lang = "es-ES";

    // Velocidad más natural
    mensaje.rate = parseFloat(
        document.getElementById("velocidad").value
    );

    // Tono más grave
    mensaje.pitch = 0.8;

    mensaje.volume = 1;

    speechSynthesis.speak(mensaje);
}

function pausar() {
    speechSynthesis.pause();
}

function reanudar() {
    speechSynthesis.resume();
}

function detener() {
    speechSynthesis.cancel();
}

</script>

</body>
</html>
