<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Texto a Voz</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

textarea{
    width:100%;
    height:250px;
    padding:15px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:12px;
    resize:none;
}

.play-btn{
    width:90px;
    height:90px;
    border:none;
    border-radius:50%;
    font-size:40px;
    cursor:pointer;
    display:block;
    margin:20px auto;
}

.play-btn:active{
    transform:scale(0.95);
}

.estado{
    text-align:center;
    margin-top:10px;
    font-size:15px;
}
</style>
</head>
<body>

<div class="container">

    <textarea id="texto" placeholder="Escribe aquí el texto que deseas escuchar..."></textarea>

    <button class="play-btn" onclick="hablar()">▶</button>

    <div class="estado" id="estado"></div>

</div>

<script>

let voces = [];

function cargarVoces() {
    voces = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = cargarVoces;

setTimeout(cargarVoces, 1000);

function buscarVozMasculina() {

    const nombresMasculinos = [
        "jorge",
        "alvaro",
        "pablo",
        "raul",
        "mateo",
        "diego",
        "carlos",
        "male"
    ];

    for (let voz of voces) {

        let nombre = voz.name.toLowerCase();

        for (let masculino of nombresMasculinos) {

            if (nombre.includes(masculino)) {
                return voz;
            }
        }
    }

    return null;
}

function hablar() {

    let texto = document.getElementById("texto").value.trim();

    if (texto === "") {
        return;
    }

    speechSynthesis.cancel();

    let mensaje = new SpeechSynthesisUtterance(texto);

    let vozMasculina = buscarVozMasculina();

    if (vozMasculina) {

        mensaje.voice = vozMasculina;

        document.getElementById("estado").innerHTML =
            "Voz utilizada: " + vozMasculina.name;

    } else {

        let vozEspanol = voces.find(v =>
            v.lang.toLowerCase().startsWith("es")
        );

        if (vozEspanol) {
            mensaje.voice = vozEspanol;
        }

        document.getElementById("estado").innerHTML =
            "No se encontró una voz masculina instalada. Android usará la voz española disponible.";
    }

    mensaje.lang = "es-ES";

    // Velocidad normal
    mensaje.rate = 0.75;

    // Tono grave
    mensaje.pitch = 0.7;

    mensaje.volume = 1;

    speechSynthesis.speak(mensaje);
}

</script>

</body>
</html>
