<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Texto a Voz</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;
}

textarea{
    width:100%;
    height:250px;
    font-size:18px;
    padding:10px;
    box-sizing:border-box;
    border-radius:10px;
    border:1px solid #ccc;
}

.play{
    width:80px;
    height:80px;
    border:none;
    border-radius:50%;
    font-size:35px;
    cursor:pointer;
    display:block;
    margin:20px auto;
}

.play:active{
    transform:scale(0.95);
}
</style>
</head>
<body>

<textarea id="texto" placeholder="Escribe aquí..."></textarea>

<button class="play" onclick="hablar()">▶</button>

<script>

let voces = [];

function cargarVoces() {
    voces = speechSynthesis.getVoices();
}

speechSynthesis.onvoiceschanged = cargarVoces;

function obtenerVoz() {

    const candidatos = [
        "male",
        "jorge",
        "alvaro",
        "pablo",
        "raul",
        "mateo"
    ];

    for (let voz of voces) {
        const nombre = voz.name.toLowerCase();

        for (let candidato of candidatos) {
            if (nombre.includes(candidato)) {
                return voz;
            }
        }
    }

    return voces.find(v => v.lang.startsWith("es")) || null;
}

function hablar() {

    const texto = document.getElementById("texto").value.trim();

    if (!texto) return;

    speechSynthesis.cancel();

    const mensaje = new SpeechSynthesisUtterance(texto);

    const voz = obtenerVoz();

    if (voz) {
        mensaje.voice = voz;
    }

    mensaje.lang = "es-ES";
    mensaje.rate = 0.8;
    mensaje.pitch = 0.7;
    mensaje.volume = 1;

    speechSynthesis.speak(mensaje);
}

</script>

</body>
</html>
